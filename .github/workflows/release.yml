name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  verify:
    uses: ./.github/workflows/test.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check release tag and changelog
        run: node tools/github-release.js validate

      - uses: actions/download-artifact@v4
        with:
          name: verified-vsix

      - name: Publish to Visual Studio Marketplace
        run: npx vsce publish --packagePath extension.vsix -p "$VSCE_PAT" --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Ensure Open VSX namespace
        run: npx ovsx create-namespace hrk-ymkw || echo "::notice::Namespace already exists"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Publish to Open VSX
        run: npx ovsx publish extension.vsix --skip-duplicate
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: extension.vsix
          retention-days: 30

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create GitHub Release
        run: node tools/github-release.js publish
        env:
          GH_TOKEN: ${{ github.token }}
